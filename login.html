<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — Oftalmo 15</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#111827" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body class="login-page">
    <main class="login-wrapper">
      <div class="login-card">
        <p class="login-brand">CRM Oftalmo 15</p>
        <h1 class="login-title">Bem-vindo de volta</h1>
        <p class="login-desc">
          Entre com suas credenciais para acessar o painel.
        </p>
        <form id="loginForm">
          <div class="input-group">
            <label for="email"><i class="fas fa-envelope" aria-hidden="true"></i> E-mail</label>
            <input
              type="email"
              id="email"
              placeholder="seu@email.com"
              required
              autocomplete="email"
              aria-describedby="errorMessage"
            />
          </div>
          <div class="input-group">
            <label for="password"><i class="fas fa-lock" aria-hidden="true"></i> Senha</label>
            <input
              type="password"
              id="password"
              placeholder="••••••••"
              required
              autocomplete="current-password"
              aria-describedby="errorMessage"
            />
          </div>
          <button type="submit" class="login-btn">
            <i class="fas fa-arrow-right-to-bracket" aria-hidden="true"></i> Entrar
          </button>
        </form>
        <p id="errorMessage" class="login-error" role="alert" aria-live="assertive"></p>
      </div>
    </main>
    <script type="module" src="login.js"></script>
  </body>
</html>
